name: release

# Build optimized native binaries on each OS runner and attach them to the GitHub Release for the
# tag. Cross-compiling to Linux/macOS from the (Windows) dev machine is impractical — the C dep
# `ring` needs a native toolchain — so we let GitHub's own runners build natively per platform.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build binaries for (e.g. v0.1.0)'
        required: true
        default: v0.1.0

permissions:
  contents: write   # needed for `gh release upload`

jobs:
  build:
    name: ${{ matrix.plat }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false   # one platform failing must not cancel the others
      matrix:
        include:
          - { os: ubuntu-latest,  plat: linux-x86_64,   ext: '' }
          - { os: macos-latest,   plat: macos-aarch64,  ext: '' }   # Apple Silicon runner
          - { os: windows-latest, plat: windows-x86_64, ext: '.exe' }
    steps:
      - name: Checkout the tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Show toolchain
        run: rustc -V && cargo -V

      - name: Build (release, dense tier on)
        # `--features dense` ships the model2vec semantic backend so the dense retrieval tier is
        # live in the released binary (gated ON by default; see `memory::settings`). The model
        # weights are NOT bundled — a user runs `aizen memory model-download` once to cache
        # potion-base-8M (~30 MB) into ~/.aizen/models/. The Windows runner is MSVC (not the
        # windows-gnu dev box), so the getrandom-0.3 raw-dylib link wall doesn't apply here.
        run: cargo build --release --features dense --bin aizen

      - name: Package binary
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          asset="aizen-${tag}-${{ matrix.plat }}${{ matrix.ext }}"
          cp "target/release/aizen${{ matrix.ext }}" "$asset"
          ls -lh "$asset"
          echo "ASSET=$asset" >> "$GITHUB_ENV"

      - name: Publish binary (private record + public release)
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIC_TOKEN: ${{ secrets.PUBLIC_SYNC_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"

          # 1) PRIVATE repo release — source-tag <-> binary record, and a fallback the owner can
          #    hand-mirror if the public token ever lapses. Uses the built-in job token.
          #    The matrix jobs race on `release create`, so swallow "already exists".
          gh release create "$tag" --repo "${{ github.repository }}" --title "$tag" \
            --notes "Automated build for $tag." 2>/dev/null || true
          gh release upload "$tag" "$ASSET" --clobber --repo "${{ github.repository }}"

          # 2) PUBLIC repo release (dawnofcd/aizen) — the actual download channel the installers
          #    pull from. Needs the fine-grained PAT secret; if it's absent we don't fail the
          #    build — the private release still holds the asset for a manual mirror.
          if [ -n "${PUBLIC_TOKEN:-}" ]; then
            GH_TOKEN="$PUBLIC_TOKEN" gh release create "$tag" --repo dawnofcd/aizen --title "$tag" \
              --notes "Aizen $tag — prebuilt binaries." 2>/dev/null || true
            GH_TOKEN="$PUBLIC_TOKEN" gh release upload "$tag" "$ASSET" --clobber --repo dawnofcd/aizen
            echo "mirrored $ASSET -> dawnofcd/aizen@$tag"
          else
            echo "PUBLIC_SYNC_TOKEN not set — skipped public mirror (private release still has $ASSET)."
          fi
